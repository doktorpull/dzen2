# Конфигурация Nginx для размещения админ-панели по адресу http://igrovoikompas.ru/dzen/
# Добавьте этот блок внутрь server { ... } для igrovoikompas.ru

location = /dzen {
    return 301 /dzen/;
}

location /dzen/ {
    proxy_pass http://127.0.0.1:8003/dzen/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Обязательно для потоковой передачи этапов генерации (SSE)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    client_max_body_size 20M;
}
